name: Build My Squishy Lab iOS
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios.yml
      - mobile/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate iOS project
        working-directory: mobile
        run: |
          xcodebuild -version
          npm install --no-audit --no-fund
          npm run sync:ios
      - name: Compile simulator app
        working-directory: mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: My-Squishy-Lab-iOS-Simulator
          path: mobile/ios-build/Build/Products/Release-iphonesimulator/App.app
          if-no-files-found: error

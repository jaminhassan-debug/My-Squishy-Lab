name: Publish Android test download
on:
  workflow_run:
    workflows: ["Build My Squishy Lab Android"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: android-test-release
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: My-Squishy-Lab-Android
          path: android-build
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish game app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          apks=list(Path('android-build').rglob('*.apk'))
          assert len(apks)==1, apks
          with zipfile.ZipFile(apks[0]) as app:
              entry=app.read('assets/public/index.html').decode()
              assert "location.replace('scene_01/preview.html')" in entry
              assert not any(name.startswith('assets/public/blog/') for name in app.namelist())
          shutil.copyfile(apks[0], 'My-Squishy-Lab-Game.apk')
          PY
          gh release view android-game-test || gh release create android-game-test --target "$SOURCE_SHA" --prerelease --title "My Squishy Lab game app" --notes "Launches directly into the game. Supports portrait and landscape. Export your saved creations before replacing an older test installation, as test builds can have different signing keys."
          gh release upload android-game-test My-Squishy-Lab-Game.apk --clobber

name: Build My Squishy Lab Android
on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - .github/workflows/mobile.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test game
        run: |
          for test in tests/*.cjs; do node "$test" || exit; done
      - name: Generate Android project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run sync:android
      - name: Package Android and Fire OS builds
        working-directory: mobile/android
        run: bash gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: My-Squishy-Lab-Android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
